name: Build desktop installers
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
          - os: ubuntu-22.04
            target: linux
            arch: x64
          - os: macos-14
            target: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: python -B -m unittest discover -s tests -v
      - run: node scripts/package.mjs ${{ matrix.target }} ${{ matrix.arch }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # Launch the packaged app (bundled Python backend + UI) and fail the build if it does not start.
      - name: Launch test
        if: runner.os != 'Linux'
        run: npm run smoke
      - name: Launch test (virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a npm run smoke
      - uses: actions/upload-artifact@v4
        with:
          name: JobTracker-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
          if-no-files-found: error
